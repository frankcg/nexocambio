<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>NexoCambio · Catálogo de API (OpenAPI)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css">
<style>body { margin: 0; }</style>
</head>
<body>
<div id="swagger-ui"></div>
<script id="spec" type="application/json">{
  "openapi": "3.0.3",
  "info": {
    "title": "NexoCambio API",
    "version": "2.0.0",
    "description": "Casa de cambio de divisas y cripto — API serverless (API Gateway HTTP API + Lambdas + DynamoDB + S3).\n\nMicroservicios: Cotizaciones, Clientes, Operaciones y **Validaciones (NexoGuard)**, más el **banco simulado**, un sistema externo con su propia clave. NexoGuard es el workflow agéntico de Step Functions que valida cada comprobante: se inicia al adjuntarlo (POST /operaciones/{id}/comprobante) y su resultado se consulta en /validaciones.\n\nFormato JSON. Los errores siempre devuelven `{mensaje, codigo}`. Las rutas de cliente van con `Authorization: Bearer <token>` (JWT HS256, ver POST /login); las de back-office simulado van con la cabecera `x-admin-key` en vez de JWT; las del banco simulado, con `x-banco-key`. Si una ruta protegida responde 401, el front limpia la sesión y redirige a login.\n\nEste documento es solo de referencia (generado por docs/generar_openapi.py a partir del contrato real); el API Gateway sigue definido con eventos SAM en template.yaml, no con este spec."
  },
  "servers": [
    {
      "url": "https://{apiId}.execute-api.{region}.amazonaws.com/v1",
      "variables": {
        "apiId": {
          "default": "TU-API-ID"
        },
        "region": {
          "default": "us-east-1"
        }
      },
      "description": "Despliegue en AWS (ver salida ApiUrl de deploy.sh)."
    },
    {
      "url": "http://localhost:8787",
      "description": "Servidor local (scripts/servidor_local.py)."
    }
  ],
  "tags": [
    {
      "name": "Cotizaciones"
    },
    {
      "name": "Clientes y autenticación"
    },
    {
      "name": "Operaciones"
    },
    {
      "name": "Back-office (admin)"
    },
    {
      "name": "NexoGuard · Validaciones",
      "description": "Subestado de la validación automática, para el cliente."
    },
    {
      "name": "NexoGuard · Back-office",
      "description": "Cola de revisión, análisis del agente, decisión del operador y reinicio de datos de prueba."
    },
    {
      "name": "Banco simulado (externo)",
      "description": "API bancaria simulada que NexoGuard consulta para conciliar depósitos."
    }
  ],
  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT"
      },
      "adminKey": {
        "type": "apiKey",
        "in": "header",
        "name": "x-admin-key"
      },
      "bancoKey": {
        "type": "apiKey",
        "in": "header",
        "name": "x-banco-key"
      }
    },
    "schemas": {
      "Error": {
        "type": "object",
        "required": [
          "mensaje",
          "codigo"
        ],
        "properties": {
          "mensaje": {
            "type": "string",
            "description": "Mensaje para mostrar al usuario, en español."
          },
          "codigo": {
            "type": "string",
            "description": "Código estable para manejar el error en el front."
          }
        }
      },
      "Cotizacion": {
        "type": "object",
        "properties": {
          "id_cotizacion": {
            "type": "string",
            "example": "COT-A1B2C3D4"
          },
          "modalidad": {
            "type": "string",
            "enum": [
              "casa",
              "cripto"
            ]
          },
          "moneda_origen": {
            "type": "string",
            "enum": [
              "PEN",
              "USD",
              "EUR",
              "USDT",
              "USDC",
              "BTC",
              "ETH"
            ]
          },
          "moneda_destino": {
            "type": "string",
            "enum": [
              "PEN",
              "USD",
              "EUR",
              "USDT",
              "USDC",
              "BTC",
              "ETH"
            ]
          },
          "monto_origen": {
            "type": "number"
          },
          "tasa": {
            "type": "number",
            "description": "moneda_destino por 1 moneda_origen, ya con el spread aplicado."
          },
          "tasa_preferencial": {
            "type": "boolean",
            "description": "true si el monto en USD alcanzó el umbral preferencial (spread reducido 40 %)."
          },
          "monto_destino": {
            "type": "number"
          },
          "fuente_tasas": {
            "type": "string",
            "enum": [
              "en_vivo",
              "cache",
              "referencial"
            ]
          },
          "fecha_cotizacion": {
            "type": "string",
            "format": "date-time"
          },
          "fecha_expiracion": {
            "type": "string",
            "format": "date-time",
            "description": "Vigencia: 5 minutos desde la emisión (configurable)."
          }
        }
      },
      "CotizarRequest": {
        "type": "object",
        "required": [
          "modalidad",
          "moneda_origen",
          "moneda_destino",
          "monto_origen"
        ],
        "properties": {
          "modalidad": {
            "type": "string",
            "enum": [
              "casa",
              "cripto"
            ]
          },
          "moneda_origen": {
            "type": "string",
            "enum": [
              "PEN",
              "USD",
              "EUR",
              "USDT",
              "USDC",
              "BTC",
              "ETH"
            ]
          },
          "moneda_destino": {
            "type": "string",
            "enum": [
              "PEN",
              "USD",
              "EUR",
              "USDT",
              "USDC",
              "BTC",
              "ETH"
            ]
          },
          "monto_origen": {
            "type": "number",
            "minimum": 0,
            "exclusiveMinimum": true,
            "description": "Equivalente entre US$ 10 y US$ 1,000,000."
          }
        },
        "description": "Modalidad 'casa': PEN/USD/EUR entre sí. Modalidad 'cripto': PEN o USD contra USDT/USDC/BTC/ETH (un extremo debe ser cripto)."
      },
      "ExtremoBanco": {
        "type": "object",
        "required": [
          "tipo",
          "banco"
        ],
        "properties": {
          "tipo": {
            "type": "string",
            "enum": [
              "banco"
            ]
          },
          "banco": {
            "type": "string",
            "enum": [
              "BCP",
              "Interbank",
              "BBVA",
              "Scotiabank",
              "BanBif",
              "Banco Pichincha"
            ]
          },
          "tipo_cuenta": {
            "type": "string",
            "enum": [
              "Ahorros",
              "Corriente"
            ],
            "description": "Solo en el destino."
          },
          "numero": {
            "type": "string",
            "pattern": "^\\d{10,20}$",
            "description": "Número de cuenta o CCI. Solo en el destino."
          },
          "titular": {
            "type": "string",
            "minLength": 2,
            "maxLength": 150,
            "description": "Solo en el destino."
          }
        },
        "description": "Para monedas fiat (PEN, USD, EUR)."
      },
      "ExtremoWallet": {
        "type": "object",
        "required": [
          "tipo",
          "red"
        ],
        "properties": {
          "tipo": {
            "type": "string",
            "enum": [
              "wallet"
            ]
          },
          "red": {
            "type": "string",
            "description": "USDT: TRON (TRC20) o Ethereum (ERC20) · USDC: Ethereum (ERC20) o Solana · BTC: Bitcoin · ETH: Ethereum (ERC20)."
          },
          "direccion": {
            "type": "string",
            "pattern": "^[A-Za-z0-9]{26,64}$",
            "description": "Solo en el destino."
          }
        },
        "description": "Para criptoactivos (USDT, USDC, BTC, ETH)."
      },
      "Extremo": {
        "oneOf": [
          {
            "$ref": "#/components/schemas/ExtremoBanco"
          },
          {
            "$ref": "#/components/schemas/ExtremoWallet"
          }
        ],
        "discriminator": {
          "propertyName": "tipo",
          "mapping": {
            "banco": "#/components/schemas/ExtremoBanco",
            "wallet": "#/components/schemas/ExtremoWallet"
          }
        }
      },
      "Representante": {
        "type": "object",
        "required": [
          "nombre",
          "tipo_documento",
          "numero_documento",
          "cargo"
        ],
        "properties": {
          "nombre": {
            "type": "string"
          },
          "tipo_documento": {
            "type": "string",
            "enum": [
              "DNI",
              "CE",
              "Pasaporte"
            ]
          },
          "numero_documento": {
            "type": "string"
          },
          "cargo": {
            "type": "string"
          }
        }
      },
      "RegistroPersona": {
        "type": "object",
        "required": [
          "tipo_cliente",
          "tipo_documento",
          "numero_documento",
          "telefono",
          "correo",
          "password",
          "nombres",
          "apellidos",
          "fecha_nacimiento"
        ],
        "properties": {
          "tipo_cliente": {
            "type": "string",
            "enum": [
              "persona"
            ]
          },
          "tipo_documento": {
            "type": "string",
            "enum": [
              "DNI",
              "CE",
              "Pasaporte"
            ]
          },
          "numero_documento": {
            "type": "string",
            "description": "DNI: 8 dígitos · CE: 9-12 alfanum. · Pasaporte: 6-12 alfanum."
          },
          "telefono": {
            "type": "string",
            "pattern": "^9\\d{8}$",
            "description": "9 dígitos, empieza con 9."
          },
          "correo": {
            "type": "string",
            "format": "email"
          },
          "password": {
            "type": "string",
            "minLength": 8,
            "description": "Mínimo 8 caracteres, con letras y números."
          },
          "nombres": {
            "type": "string"
          },
          "apellidos": {
            "type": "string"
          },
          "fecha_nacimiento": {
            "type": "string",
            "format": "date",
            "description": "Debe ser mayor de edad."
          },
          "ocupacion": {
            "type": "string",
            "enum": [
              "Dependiente",
              "Independiente",
              "Empresario",
              "Estudiante",
              "Jubilado",
              "Otro"
            ]
          },
          "pep": {
            "type": "boolean",
            "default": false,
            "description": "Persona Expuesta Políticamente."
          }
        }
      },
      "RegistroEmpresa": {
        "type": "object",
        "required": [
          "tipo_cliente",
          "tipo_documento",
          "numero_documento",
          "telefono",
          "correo",
          "password",
          "razon_social",
          "representante"
        ],
        "properties": {
          "tipo_cliente": {
            "type": "string",
            "enum": [
              "empresa"
            ]
          },
          "tipo_documento": {
            "type": "string",
            "enum": [
              "RUC"
            ]
          },
          "numero_documento": {
            "type": "string",
            "pattern": "^(10|15|17|20)\\d{9}$",
            "description": "RUC: 11 dígitos."
          },
          "telefono": {
            "type": "string",
            "pattern": "^9\\d{8}$"
          },
          "correo": {
            "type": "string",
            "format": "email"
          },
          "password": {
            "type": "string",
            "minLength": 8
          },
          "razon_social": {
            "type": "string",
            "minLength": 2,
            "maxLength": 150
          },
          "actividad": {
            "type": "string",
            "enum": [
              "Comercio",
              "Servicios",
              "Manufactura",
              "Tecnología",
              "Construcción",
              "Otro"
            ]
          },
          "representante": {
            "$ref": "#/components/schemas/Representante"
          }
        }
      },
      "RegistroRequest": {
        "oneOf": [
          {
            "$ref": "#/components/schemas/RegistroPersona"
          },
          {
            "$ref": "#/components/schemas/RegistroEmpresa"
          }
        ],
        "discriminator": {
          "propertyName": "tipo_cliente",
          "mapping": {
            "persona": "#/components/schemas/RegistroPersona",
            "empresa": "#/components/schemas/RegistroEmpresa"
          }
        }
      },
      "RegistroResponse": {
        "type": "object",
        "properties": {
          "id_cliente": {
            "type": "string",
            "example": "CLI-X1Y2Z3"
          },
          "mensaje": {
            "type": "string"
          }
        }
      },
      "LoginRequest": {
        "type": "object",
        "required": [
          "correo",
          "password"
        ],
        "properties": {
          "correo": {
            "type": "string",
            "format": "email"
          },
          "password": {
            "type": "string"
          }
        }
      },
      "Cliente": {
        "type": "object",
        "description": "Perfil público (sin password_hash). Persona natural o empresa, según tipo_cliente.",
        "properties": {
          "id_cliente": {
            "type": "string"
          },
          "tipo_cliente": {
            "type": "string",
            "enum": [
              "persona",
              "empresa"
            ]
          },
          "nombre": {
            "type": "string",
            "description": "Nombre completo o razón social, para mostrar en pantalla."
          },
          "correo": {
            "type": "string",
            "format": "email"
          },
          "telefono": {
            "type": "string"
          },
          "tipo_documento": {
            "type": "string"
          },
          "numero_documento": {
            "type": "string"
          },
          "fecha_registro": {
            "type": "string",
            "format": "date-time"
          },
          "nombres": {
            "type": "string",
            "description": "Solo persona."
          },
          "apellidos": {
            "type": "string",
            "description": "Solo persona."
          },
          "fecha_nacimiento": {
            "type": "string",
            "format": "date",
            "description": "Solo persona."
          },
          "ocupacion": {
            "type": "string",
            "description": "Solo persona."
          },
          "pep": {
            "type": "boolean",
            "description": "Solo persona."
          },
          "razon_social": {
            "type": "string",
            "description": "Solo empresa."
          },
          "actividad": {
            "type": "string",
            "description": "Solo empresa."
          },
          "representante": {
            "allOf": [
              {
                "$ref": "#/components/schemas/Representante"
              }
            ],
            "description": "Solo empresa."
          }
        }
      },
      "LoginResponse": {
        "type": "object",
        "properties": {
          "token": {
            "type": "string",
            "description": "JWT HS256, cabecera Authorization: Bearer <token>."
          },
          "expira_en": {
            "type": "integer",
            "description": "Segundos de vigencia del token (por defecto 7200).",
            "example": 7200
          },
          "cliente": {
            "$ref": "#/components/schemas/Cliente"
          }
        }
      },
      "CrearOperacionRequest": {
        "type": "object",
        "required": [
          "id_cotizacion",
          "origen",
          "destino"
        ],
        "properties": {
          "id_cotizacion": {
            "type": "string",
            "description": "De una cotización vigente (POST /cotizar). Se usa una sola vez."
          },
          "origen": {
            "$ref": "#/components/schemas/Extremo"
          },
          "destino": {
            "$ref": "#/components/schemas/Extremo"
          }
        },
        "description": "El servidor toma moneda/monto/tasa de la cotización; ignora los que envíe el cliente (si los envía, deben coincidir)."
      },
      "HistorialItem": {
        "type": "object",
        "properties": {
          "estado": {
            "type": "string",
            "enum": [
              "Pendiente de validación",
              "En proceso",
              "Procesada",
              "Rechazada"
            ]
          },
          "fecha": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "Operacion": {
        "type": "object",
        "properties": {
          "id_operacion": {
            "type": "string",
            "example": "NX-A1B2C3D4"
          },
          "id_cliente": {
            "type": "string"
          },
          "id_cotizacion": {
            "type": "string"
          },
          "modalidad": {
            "type": "string",
            "enum": [
              "casa",
              "cripto"
            ]
          },
          "moneda_origen": {
            "type": "string",
            "enum": [
              "PEN",
              "USD",
              "EUR",
              "USDT",
              "USDC",
              "BTC",
              "ETH"
            ]
          },
          "moneda_destino": {
            "type": "string",
            "enum": [
              "PEN",
              "USD",
              "EUR",
              "USDT",
              "USDC",
              "BTC",
              "ETH"
            ]
          },
          "monto_origen": {
            "type": "number"
          },
          "monto_destino": {
            "type": "number"
          },
          "tasa": {
            "type": "number"
          },
          "tasa_preferencial": {
            "type": "boolean"
          },
          "estado": {
            "type": "string",
            "enum": [
              "Pendiente de validación",
              "En proceso",
              "Procesada",
              "Rechazada"
            ],
            "description": "'Pendiente de comprobante' es un estado interno previo (borrador); nunca se devuelve en las listas."
          },
          "fecha_operacion": {
            "type": "string",
            "format": "date-time"
          },
          "historial": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/HistorialItem"
            }
          },
          "origen": {
            "$ref": "#/components/schemas/Extremo"
          },
          "destino": {
            "$ref": "#/components/schemas/Extremo"
          },
          "comprobante_nombre": {
            "type": "string",
            "description": "Presente desde que se adjunta el comprobante."
          },
          "comprobante_tipo": {
            "type": "string",
            "enum": [
              "image/jpeg",
              "image/png",
              "image/webp",
              "application/pdf"
            ]
          },
          "comprobante_tamano": {
            "type": "integer",
            "description": "Bytes."
          },
          "numero_transferencia": {
            "type": "string"
          },
          "comprobante_url": {
            "type": "string",
            "format": "uri",
            "description": "URL firmada (S3), temporal (900 s). Solo en el detalle, no en los listados."
          },
          "motivo_rechazo": {
            "type": "string",
            "description": "Presente solo si estado es 'Rechazada'."
          }
        }
      },
      "OperacionesListResponse": {
        "type": "object",
        "properties": {
          "operaciones": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Operacion"
            }
          },
          "total": {
            "type": "integer"
          }
        }
      },
      "ComprobanteRequest": {
        "type": "object",
        "required": [
          "nombre_archivo",
          "content_type",
          "contenido_base64"
        ],
        "properties": {
          "nombre_archivo": {
            "type": "string"
          },
          "content_type": {
            "type": "string",
            "enum": [
              "image/jpeg",
              "image/png",
              "image/webp",
              "application/pdf"
            ]
          },
          "contenido_base64": {
            "type": "string",
            "format": "byte",
            "description": "Archivo codificado en base64. Máx. 4 MB; el contenido real debe coincidir con content_type (se valida la firma del archivo)."
          },
          "numero_transferencia": {
            "type": "string",
            "maxLength": 40
          }
        }
      },
      "EstadoRequest": {
        "type": "object",
        "required": [
          "estado"
        ],
        "properties": {
          "estado": {
            "type": "string",
            "enum": [
              "En proceso",
              "Procesada",
              "Rechazada"
            ]
          },
          "motivo_rechazo": {
            "type": "string",
            "minLength": 3,
            "maxLength": 300,
            "description": "Obligatorio cuando estado es 'Rechazada'."
          }
        }
      },
      "ValidacionCliente": {
        "type": "object",
        "description": "Vista del cliente: solo el estado y el resultado, sin el análisis de la IA.",
        "properties": {
          "id_operacion": {
            "type": "string"
          },
          "estado": {
            "type": "string",
            "enum": [
              "en_curso",
              "en_revision",
              "finalizada"
            ]
          },
          "fecha_inicio": {
            "type": "string",
            "format": "date-time"
          },
          "fecha_fin": {
            "type": "string",
            "format": "date-time",
            "nullable": true
          },
          "estado_final": {
            "type": "string",
            "enum": [
              "En proceso",
              "Rechazada"
            ],
            "nullable": true
          },
          "decidido_por": {
            "type": "string",
            "enum": [
              "agente",
              "operador"
            ],
            "nullable": true
          },
          "motivo": {
            "type": "string",
            "nullable": true,
            "description": "Solo cuando la operación se rechazó."
          }
        }
      },
      "Extraccion": {
        "type": "object",
        "description": "Salida del Agente Extractor (Groq, visión).",
        "properties": {
          "es_comprobante": {
            "type": "boolean",
            "nullable": true
          },
          "legible": {
            "type": "boolean"
          },
          "banco_origen": {
            "type": "string",
            "nullable": true
          },
          "monto": {
            "type": "number",
            "nullable": true
          },
          "moneda": {
            "type": "string",
            "nullable": true
          },
          "fecha": {
            "type": "string",
            "format": "date",
            "nullable": true
          },
          "hora": {
            "type": "string",
            "nullable": true
          },
          "numero_operacion": {
            "type": "string",
            "nullable": true
          },
          "destinatario": {
            "type": "string",
            "nullable": true
          },
          "cuenta_destino": {
            "type": "string",
            "nullable": true
          },
          "banco_destino": {
            "type": "string",
            "nullable": true
          },
          "confianza": {

        },
        "responses": {
          "201": {
            "description": "Cotización creada.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Cotizacion"
                },
                "example": {
                  "id_cotizacion": "COT-A1B2C3D4",
                  "modalidad": "casa",
                  "moneda_origen": "PEN",
                  "moneda_destino": "USD",
                  "monto_origen": 1000,
                  "tasa": 3.7421,
                  "tasa_preferencial": false,
                  "monto_destino": 267.23,
                  "fuente_tasas": "en_vivo",

              }
            }
          },
          "400": {
            "description": "Cuerpo inválido o faltan campos. Valores posibles de `codigo`: `cuerpo_vacio`, `cuerpo_invalido`, `json_invalido`, `campos_faltantes`, `modalidad_invalida`, `monto_invalido`.",

              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                },
                "example": {
                  "mensaje": "Cuerpo inválido o faltan campos.",
                  "codigo": "cuerpo_vacio"

              }

          },
