<header class="top">
  <div class="wrap nav">
    <a class="brand" routerLink="/admin/operaciones" aria-label="Back-office NexoCambio, inicio">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect class="b" x="2" y="2" width="17" height="17" rx="5" />
        <rect class="a" x="13" y="13" width="17" height="17" rx="5" />
      </svg>
      <span class="brand-t">NexoCambio</span>
    </a>
    <span class="tag" style="margin-left: -6px">Back-office</span>
    <div class="auth">
      @if (auth.autenticado()) {
        <button class="btn btn-ghost" type="button" (click)="salir()">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" /><path d="M16 17l5-5-5-5" /><path d="M21 12H9" /></svg>
          Salir
        </button>
      }
    </div>
  </div>
</header>
